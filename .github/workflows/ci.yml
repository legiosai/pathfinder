# Validates the catalog, runs the tests and opens the built site in headless Chrome on every pull request.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm test
      - run: npm run build
      # Chrome comes preinstalled on ubuntu-latest.
      - run: npm run smoke
