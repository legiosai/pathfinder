# Validates the catalog, runs the tests and opens the built site in headless Chrome on every pull request.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm test
      - run: npm run build
      # Chrome comes preinstalled on ubuntu-latest.
      - run: npm run smoke

  # The chat Worker in worker/ has its own dependencies; the site above stays dependency-free.
  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Proves the Worker bundles; it neither logs in nor uploads anything.
      - run: npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/worker-dry-run"
