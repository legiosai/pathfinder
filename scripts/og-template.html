<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>og</title>
<style>
@font-face { font-family: "Instrument Serif"; src: url("fonts/instrument-serif.woff2") format("woff2"); font-weight: 400; font-style: normal; }
@font-face { font-family: "Instrument Serif"; src: url("fonts/instrument-serif-italic.woff2") format("woff2"); font-weight: 400; font-style: italic; }
@font-face { font-family: "Inter"; src: url("fonts/inter-latin.woff2") format("woff2"); font-weight: 100 900; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
body { position: relative; background: #f8f7f4; color: #191816; font: 400 24px/1.4 "Inter", system-ui, sans-serif; font-synthesis: none; -webkit-font-smoothing: antialiased; }
.frame { position: absolute; inset: 56px 72px 116px 72px; display: flex; flex-direction: column; }
#root { flex: 1; align-content: center; }
.brand { display: inline-flex; align-items: center; gap: 14px; font: 400 36px/1 "Instrument Serif", Georgia, serif; letter-spacing: -0.01em; }
.brand img { width: 36px; height: 36px; border-radius: 9px; }
.foot { position: absolute; left: 72px; right: 72px; bottom: 40px; display: flex; justify-content: space-between; padding-top: 18px; border-top: 1.5px solid #e5e2db; color: #64615a; font-size: 21px; }
.cert { display: grid; grid-template-columns: minmax(0, 1fr) 236px; gap: 56px; align-items: center; }
.who { color: #64615a; font-size: 25px; font-weight: 500; letter-spacing: -0.01em; }
h1 { margin: 14px 0 0; font: 400 82px/1 "Instrument Serif", Georgia, serif; letter-spacing: -0.015em; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; text-wrap: balance; }
h1.long { font-size: 64px; }
.facts { display: flex; margin: 30px 0 0; border-top: 1.5px solid #e5e2db; }
.facts div { padding: 16px 40px 0 0; }
.facts div + div { padding-left: 28px; border-left: 1.5px solid #e5e2db; }
.facts dt { color: #64615a; font-size: 19px; }
.facts dd { margin: 4px 0 0; font-size: 30px; font-weight: 500; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; white-space: nowrap; }
.badge-box { display: grid; place-items: center; }
.badge-box .badge { width: 236px; height: auto; }
.home { display: grid; grid-template-columns: minmax(0, 1fr) 316px; gap: 48px; align-items: center; }
.home h1 { margin: 0; font-size: 86px; line-height: 0.96; -webkit-line-clamp: 4; }
.home h1 em { color: #64615a; }
.home p { max-width: 560px; margin: 26px 0 0; color: #64615a; font-size: 26px; line-height: 1.4; }
.wall { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px 22px; justify-items: center; }
.wall .badge { width: 90px; height: auto; filter: grayscale(1) contrast(0.92) opacity(0.5); }
.wall .lit { filter: none; }
</style>
</head>
<body>
<div id="sprite" hidden></div>
<div class="frame"><span class="brand"><img src="icon.svg" alt="">pathfinder</span><main id="root"></main></div>
<div class="foot"><span id="tagline">Pick a certification. Plan the climb.</span><span>legiosai.github.io/pathfinder</span></div>
<script type="module">
import { badge } from './visuals.js';
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const [catalog, html] = await Promise.all([fetch('catalog.json').then((r) => r.json()), fetch('index.html').then((r) => r.text())]);
// Generated badges draw issuer logos from the app's sprite.
const sprite = html.match(/<svg[^>]*style="display:none"[^>]*>[\s\S]*?<\/svg>/);
document.getElementById('sprite').innerHTML = sprite ? sprite[0] : '';
const id = new URLSearchParams(location.search).get('id');
const root = document.getElementById('root');
const levels = Object.fromEntries(catalog.taxonomy.levels.map((l) => [l.id, l.label]));
if (!id) {
  // Nine badges in grey with one in colour, like the wall on the home page.
  const featured = ['nvidia-nca-genl', 'aws-aif-c01', 'google-agentic-architect', 'lf-mcpa', 'claude-architect-foundations', 'databricks-genai-engineer', 'comptia-security-plus', 'github-gh-600', 'isc2-cc'];
  const certs = featured.map((f) => catalog.certifications.find((c) => c.id === f)).filter(Boolean);
  root.className = 'home';
  root.innerHTML = `<div><h1>Pick a certification.<br><em>Plan the climb.</em></h1><p>${catalog.certifications.length} IT certifications compared, each one a dated study plan away.</p></div>
    <div class="wall">${certs.map((c, i) => badge(c, 90, { label: false }).replace('class="badge', `class="badge${i === 4 ? ' lit' : ''}`)).join('')}</div>`;
  document.getElementById('tagline').textContent = 'Open source, runs in your browser';
} else {
  const c = catalog.certifications.find((x) => x.id === id);
  const usd = c.fee.usd;
  const fee = usd == null ? 'Varies' : usd === 0 ? 'Free' : `US$${usd % 1 ? usd.toFixed(2) : usd}`;
  const m = c.exam.minutes;
  const len = m ? (m < 60 ? `${m} min` : `${Math.floor(m / 60)} h${m % 60 ? ` ${m % 60}` : ''}`) : c.exam.style === 'practical' ? 'Practical' : '';
  const facts = [['Price', fee], ['Length', len], ['Level', levels[c.level]], c.domains.length ? ['Domains', String(c.domains.length)] : null].filter((f) => f && f[1]);
  root.className = 'cert';
  root.innerHTML = `<div>
      <div class="who">${esc(c.provider)} · ${esc(c.code)}</div>
      <h1 class="${c.name.length > 44 ? 'long' : ''}">${esc(c.name)}</h1>
      <dl class="facts">${facts.map(([k, v]) => `<div><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join('')}</dl>
    </div>
    <div class="badge-box">${badge(c, 236, { label: false })}</div>`;
}
await document.fonts.ready;
document.title = 'ready';
</script>
</body>
</html>
